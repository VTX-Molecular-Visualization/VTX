name: Setup VTX build environment
description: Install Ninja, Conan (with the VTX remote), optional CUDA toolkit, xvfb and MSVC environment.

inputs:
  conan_host:
    description: 'VTX Conan remote URL (public: reading is anonymous, so pull requests from forks can build)'
    required: false
    default: 'https://conan.drugdesign.fr'
  conan_user:
    description: 'Conan remote user'
    required: false
    default: ''
  conan_password:
    description: 'Conan remote password'
    required: false
    default: ''
  cuda_version:
    description: 'CUDA toolkit version to install (empty = no CUDA)'
    required: false
    default: ''
  xvfb:
    description: 'Install xvfb on Linux (needed to run Qt tests headless)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
  - name: Install Ninja
    uses: seanmiddleditch/gha-setup-ninja@v5

  - name: Setup Conan
    uses: conan-io/setup-conan@v1.3.0
    with:
      use_venv: true
      profile_detect: true

  - name: Add custom remote
    shell: bash
    env:
      CONAN_HOST: ${{ inputs.conan_host }}
      CONAN_USER: ${{ inputs.conan_user }}
      CONAN_PASSWORD: ${{ inputs.conan_password }}
    run: |
      # The VTX remote hosts in-house packages required by the build: it cannot work without it.
      if [ -z "$CONAN_HOST" ]; then
        echo "::error::VTX Conan remote URL is unavailable (e.g. pull request from a fork): the build requires the VTX remote."
        exit 1
      fi
      conan remote add vtx "$CONAN_HOST" --index 0
      # Reading is anonymous; credentials are only needed to upload (VTX_CONAN_AUTHENTICATED gates the upload steps).
      if [ -n "$CONAN_USER" ] && [ -n "$CONAN_PASSWORD" ]; then
        conan remote login -p "$CONAN_PASSWORD" vtx "$CONAN_USER"
        echo "VTX_CONAN_AUTHENTICATED=true" >> "$GITHUB_ENV"
      else
        echo "::notice::No Conan credentials: VTX remote used anonymously, uploads disabled."
      fi

  - name: Install xvfb (Linux)
    if: runner.os == 'Linux' && inputs.xvfb == 'true'
    shell: bash
    run: sudo apt-get install -y xvfb

  - name: Install CUDA Toolkit
    if: inputs.cuda_version != ''
    uses: Jimver/cuda-toolkit@v0.2.32
    with:
      cuda: ${{ inputs.cuda_version }}
      method: network
      linux-local-args: '["--toolkit"]'

  - name: Setup CUDA environment
    if: inputs.cuda_version != ''
    shell: bash
    run: |
      if [[ "$RUNNER_OS" == "Windows" ]]; then
        CUDA_PATH_WIN="$(cygpath -m "$CUDA_PATH")"
        CUDA_PATH_UNIX="$(cygpath -u "$CUDA_PATH")"
        NVCC="$CUDA_PATH_WIN/bin/nvcc.exe"
        CUDA_BIN="$CUDA_PATH_UNIX/bin"
      else
        CUDA_PATH_WIN="$CUDA_PATH"
        NVCC="$CUDA_PATH/bin/nvcc"
        CUDA_BIN="$CUDA_PATH/bin"
      fi

      echo "CUDA_PATH=$CUDA_PATH_WIN"
      echo "CUDA_BIN=$CUDA_BIN"
      echo "NVCC=$NVCC"
      "$NVCC" --version

      echo "$CUDA_BIN" >> "$GITHUB_PATH"
      echo "CUDA_PATH=$CUDA_PATH_WIN" >> "$GITHUB_ENV"
      echo "CUDAToolkit_ROOT=$CUDA_PATH_WIN" >> "$GITHUB_ENV"
      echo "CUDACXX=$NVCC" >> "$GITHUB_ENV"

  - name: Check CUDA
    if: inputs.cuda_version != ''
    shell: bash
    run: nvcc --version

  - name: Setup MSVC environment
    if: runner.os == 'Windows'
    uses: ilammy/msvc-dev-cmd@v1
