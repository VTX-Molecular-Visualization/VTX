name: iwyu

on:
  workflow_dispatch:
      inputs:
        lib:
          description: 'Library to analyze'
          required: true
          default: 'util'
          type: choice
          options:
          - util
          - core
          - io
          - renderer
          - app
          - python_binding
          - ui/qt
        iwyu_args:
          description: 'Extra IWYU arguments (e.g. -Xiwyu --no_fwd_decls)'
          required: false
          default: ''
          type: string

permissions:
  contents: read

env:
  DEV_DIR: ${{github.workspace}}/dev
  BUILD_DIR: ${{github.workspace}}/dev/build/Release
  BUILD_TYPE: Release

jobs:
  iwyu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Install IWYU
      run: |
        sudo apt-get update
        sudo apt-get install -y iwyu jq
        include-what-you-use --version

    - name: Setup build environment
      uses: ./.github/actions/setup-vtx
      with:
        conan_user: ${{ secrets.CONAN_SERVER_USER }}
        conan_password: ${{ secrets.CONAN_SERVER_PASSWORD }}
        build_type: ${{ env.BUILD_TYPE }}

    - name: Install dependencies
      working-directory: ${{env.DEV_DIR}}
      shell: bash
      run: |
        conan export ../lib/ui/qt/conan/wayland
        conan install . -b missing \
          -o vtx/*:tool_example=True \
          -o vtx/*:tool_mdprep=True \
          -o vtx/*:tool_topology_editor=True

    - name: Configure
      working-directory: ${{env.DEV_DIR}}
      run: |
        cmake --preset conan-release \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DVTX_ENABLE_PCH=OFF \
          -DCMAKE_GLOBAL_AUTOGEN_TARGET=ON

    - name: Generate Qt sources
      if: inputs.lib == 'ui/qt'
      run: cmake --build ${{env.BUILD_DIR}} --target autogen

    - name: Filter compilation database
      working-directory: ${{env.BUILD_DIR}}
      run: |
        jq --arg lib "/lib/${{ inputs.lib }}/" '[.[] | select((.file | contains($lib)) and (.file | test("/vendor/|/build/|/test/") | not))]' compile_commands.json > compile_commands.filtered.json
        mv compile_commands.filtered.json compile_commands.json
        echo "Translation units: $(jq length compile_commands.json)"

    - name: Run IWYU
      working-directory: ${{github.workspace}}
      shell: bash
      run: |
        IWYU_TOOL=$(command -v iwyu_tool || command -v iwyu_tool.py)
        MAPPING_ARGS=()
        if [ -f tool/iwyu/vtx.imp ]; then
          MAPPING_ARGS=(-Xiwyu --mapping_file=${{github.workspace}}/tool/iwyu/vtx.imp)
        fi
        "$IWYU_TOOL" -p "${{env.BUILD_DIR}}" -j "$(nproc)" -- \
          -Xiwyu --no_comments \
          -Xiwyu --cxx17ns \
          "${MAPPING_ARGS[@]}" \
          ${{ inputs.iwyu_args }} \
          > iwyu.out 2>&1 || true

    - name: Build patch
      working-directory: ${{github.workspace}}
      shell: bash
      run: |
        FIX_INCLUDES=$(command -v fix_include || command -v fix_includes.py)
        "$FIX_INCLUDES" --nocomments --noreorder --nosafe_headers < iwyu.out || true
        git diff > iwyu.patch

    - name: Summary
      working-directory: ${{github.workspace}}
      shell: bash
      run: |
        {
          echo "## IWYU: \`${{ inputs.lib }}\`"
          echo ""
          echo "- Files with suggestions: $(grep -c 'should add these lines:' iwyu.out || true)"
          echo "- Errors: $(grep -c 'error:' iwyu.out || true)"
          echo "- Patch: $(git diff --shortstat)"
          echo ""
          echo "### Forward declarations suggested"
          echo '```'
          grep -E '^(namespace .*\{ *)?(class|struct) [A-Za-z_][A-Za-z0-9_:<>, ]*;' iwyu.out | sort | uniq -c | sort -rn | head -200 || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: iwyu-${{ github.run_id }}
        path: |
          iwyu.out
          iwyu.patch
          ${{env.BUILD_DIR}}/compile_commands.json
