name: Include What You Use

on:
  workflow_dispatch:
      inputs:
        iwyu_args:
          description: 'Extra IWYU arguments (e.g. -Xiwyu --no_fwd_decls)'
          required: false
          default: ''
          type: string

permissions:
  contents: read

env:
  DEV_DIR: ${{github.workspace}}/dev
  BUILD_DIR: ${{github.workspace}}/dev/build/Release
  BUILD_TYPE: Release

jobs:
  iwyu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Install IWYU
      run: |
        sudo apt-get update
        sudo apt-get install -y iwyu jq
        include-what-you-use --version

    - name: Setup Conan
      uses: conan-io/setup-conan@v1.3.0
      with:
        use_venv: true
        profile_detect: true

    - name: Add custom remote
      run: |
        conan remote add vtx ${{ secrets.CONAN_SERVER_HOST }} --index 0
        conan remote login -p ${{ secrets.CONAN_SERVER_PASSWORD }} vtx ${{ secrets.CONAN_SERVER_USER }}

    - name: Install dependencies
      working-directory: ${{env.DEV_DIR}}
      shell: bash
      run: |
        conan install . -b missing \
          -s build_type=${{ env.BUILD_TYPE }} \
          -s compiler.cppstd=gnu20 \
          -o vtx/*:tool_example=True \
          -o vtx/*:tool_mdprep=True \
          -o vtx/*:tool_topology_editor=True \
          -c tools.system.package_manager:mode=install \
          -c tools.system.package_manager:sudo=True

    - name: Configure
      working-directory: ${{env.DEV_DIR}}
      run: |
        cmake --preset conan-release \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_GLOBAL_AUTOGEN_TARGET=ON

    - name: Generate Qt sources
      run: cmake --build ${{env.BUILD_DIR}} --target autogen

    - name: Filter compilation database
      working-directory: ${{env.BUILD_DIR}}
      run: |
        jq '[.[] | select((.file | test("/(lib|tool|app)/")) and (.file | test("/vendor/|/build/|/test/") | not))]' compile_commands.json > compile_commands.filtered.json
        mv compile_commands.filtered.json compile_commands.json
        echo "Translation units: $(jq length compile_commands.json)"

    - name: Run IWYU
      working-directory: ${{github.workspace}}
      shell: bash
      run: |
        IWYU_TOOL=$(command -v iwyu_tool || command -v iwyu_tool.py)
        MAPPING_ARGS=()
        if [ -f tool/iwyu/vtx.imp ]; then
          MAPPING_ARGS=(-Xiwyu --mapping_file=${{github.workspace}}/tool/iwyu/vtx.imp)
        fi
        "$IWYU_TOOL" -p "${{env.BUILD_DIR}}" -j "$(nproc)" -- \
          -Xiwyu --no_comments \
          -Xiwyu --cxx17ns \
          "${MAPPING_ARGS[@]}" \
          ${{ inputs.iwyu_args }} \
          > iwyu.out 2>&1 || true

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: iwyu
        path: |
          iwyu.out
          ${{env.BUILD_DIR}}/compile_commands.json
