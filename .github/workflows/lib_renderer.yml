name: Lib Renderer

on:
  push:
    branches: [ "master", "dev", "dev-sge", "dev-vge" ]
    paths: ['lib/renderer/**', '.github/workflows/lib_renderer.yml']
  workflow_dispatch:
      inputs:
        build_type:
          description: 'Build type'
          required: true
          default: 'Release'
          type: choice
          options:
          - Debug
          - Release
        cuda_version:
          description: 'CUDA version'
          required: true
          default: '13.2.1'
        cuda_arch:
          description: 'Cuda architectures'
          required: false

env:
  LIB_DIR: ${{github.workspace}}/lib
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
  CUDA_VERSION: ${{ inputs.cuda_version || '13.2.1' }}
  CUDA_ARCH: ${{ inputs.cuda_arch }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2022
            conan_cppstd: '20'
          - os: ubuntu-22.04
            conan_cppstd: 'gnu20'
          - os: windows-latest
            conan_cppstd: '20'
          - os: ubuntu-latest
            conan_cppstd: 'gnu20'
          - os: windows-11-arm
            conan_cppstd: '20'
          - os: ubuntu-22.04-arm
            conan_cppstd: 'gnu20'
          - os: macos-15-intel
            conan_cppstd: '20'
          - os: macos-15
            conan_cppstd: '20'
      fail-fast: false

    steps:
    - name: Set git to use CRLF
      if: runner.os == 'Windows'
      run: |
        git config --global core.autocrlf true
        git config --global core.eol crlf
        
    - uses: actions/checkout@v6.0.2
      with:
        submodules: recursive   
        
    - name: Setup Conan
      uses: conan-io/setup-conan@v1.3.0
      with:
        use_venv: true
        profile_detect: true

    - name: Add custom remote
      run: |
        conan remote add vtx ${{ secrets.CONAN_SERVER_HOST }}
        conan remote login -p ${{ secrets.CONAN_SERVER_PASSWORD }} vtx ${{ secrets.CONAN_SERVER_USER }}

    - name: Create package
      working-directory: ${{env.LIB_DIR}}
      shell: bash
      run: |
        CUDA_ARCH_OPTION=()
        if [ -n "${CUDA_ARCH}" ]; then
          CUDA_ARCH_OPTION=(-o "vtx_renderer/*:cuda_arch=${CUDA_ARCH}")
        fi

        conan export util
        conan export core
        conan create renderer -b missing \
          -s build_type=${{env.BUILD_TYPE}} \
          -s compiler.cppstd=${{ matrix.conan_cppstd }} \
          -o vtx_renderer/*:test=True \
          "${CUDA_ARCH_OPTION[@]}" \
          -c tools.system.package_manager:mode=install \
          -c tools.system.package_manager:sudo=True 
