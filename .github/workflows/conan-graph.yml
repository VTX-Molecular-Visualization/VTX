name: conan-graph

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
        - Debug
        - Release
      tool_example:
        description: 'Include tool Example'
        required: false
        default: false
        type: boolean
      tool_mdprep:
        description: 'Include tool Mdprep'
        required: false
        default: true
        type: boolean
      tool_topology_editor:
        description: 'Include tool Topology Editor'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  ROOT_DIR: ${{ github.workspace }}
  BUILD_TYPE: ${{ inputs.build_type }}
  TOOL_EXAMPLE: ${{ inputs.tool_example == true && 'True' || 'False' }}
  TOOL_MDPREP: ${{ inputs.tool_mdprep == true && 'True' || 'False' }}
  TOOL_TOPOLOGY_EDITOR: ${{ inputs.tool_topology_editor == true && 'True' || 'False' }}

jobs:
  conan-graph:
    name: conan-graph (${{ matrix.channel }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            channel: win
          - os: ubuntu-22.04
            channel: linux
          - os: windows-latest
            channel: win-latest
          - os: ubuntu-latest
            channel: linux-latest
          # - os: windows-11-arm
          #   channel: win-arm
          # - os: ubuntu-22.04-arm
          #   channel: linux-arm
          # - os: macos-15-intel
          #   channel: macos-intel
          # - os: macos-15
          #   channel: macos-arm

    steps:
    - name: Set git to use CRLF
      if: runner.os == 'Windows'
      run: |
        git config --global core.autocrlf true
        git config --global core.eol crlf

    - uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Setup build environment
      uses: ./.github/actions/setup-vtx
      with:
        conan_user: ${{ secrets.CONAN_SERVER_USER }}
        conan_password: ${{ secrets.CONAN_SERVER_PASSWORD }}
        build_type: ${{ env.BUILD_TYPE }}

    - name: Export local packages
      working-directory: ${{ env.ROOT_DIR }}
      run: |
        conan export lib/app
        conan export lib/core
        conan export lib/io
        conan export lib/python_binding
        conan export lib/renderer
        conan export lib/ui/qt
        conan export lib/ui/qt/conan/wayland
        conan export lib/util
        conan export tool/example
        conan export tool/mdprep
        conan export tool/topology_editor
      shell: bash

    - name: Generate Conan dependency graph
      working-directory: ${{ env.ROOT_DIR }}
      run: |
        mkdir -p artifacts
        conan graph info app/vtx \
          -o vtx/*:tool_example=${{ env.TOOL_EXAMPLE }} \
          -o vtx/*:tool_mdprep=${{ env.TOOL_MDPREP }} \
          -o vtx/*:tool_topology_editor=${{ env.TOOL_TOPOLOGY_EDITOR }} \
          -o vtx_app/*:version=0.0.0 \
          --format=html \
          --out-file "${{ env.ROOT_DIR }}/artifacts/conan-graph-${{ matrix.channel }}.html"
      shell: bash

    - name: Upload Conan graph artifact
      uses: actions/upload-artifact@v7.0.0
      with:
        name: conan-graph-${{ matrix.channel }}
        path: ${{ env.ROOT_DIR }}/artifacts/conan-graph-${{ matrix.channel }}.html
        if-no-files-found: error
