name: clang-tidy

on:
  push:
    branches: [ "dev" ]
    paths: ['app/**', 'lib/**', 'tool/**', 'dev/**', '.clang-tidy', '.github/workflows/clang-tidy.yml', '.github/scripts/run_clang_tidy.py', '.github/actions/setup-vtx/**']
  pull_request:
    branches: [ "dev" ]
    paths: ['app/**', 'lib/**', 'tool/**', 'dev/**', '.clang-tidy', '.github/workflows/clang-tidy.yml', '.github/scripts/run_clang_tidy.py', '.github/actions/setup-vtx/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  DEV_DIR: ${{github.workspace}}/dev
  LLVM_VERSION: 22
  LLVM_VERSION_WINDOWS: 22.1.3

jobs:
  clang-tidy:
    name: clang-tidy (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-2022 ]
        build_type: [ Release ]
        include:
          - os: ubuntu-latest
            conan_cppstd: 'gnu20'
            conan_extra: '-c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True'
          - os: windows-2022
            conan_cppstd: '20'
            conan_extra: ''
      fail-fast: false

    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      BUILD_DIR: ${{github.workspace}}/dev/build/${{ matrix.build_type }}

    steps:
    - name: Set git to use CRLF
      if: runner.os == 'Windows'
      run: |
        git config --global core.autocrlf true
        git config --global core.eol crlf

    - uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Install clang-tidy (Linux)
      if: runner.os == 'Linux'
      run: |
        wget -q https://apt.llvm.org/llvm.sh
        sudo bash llvm.sh ${{ env.LLVM_VERSION }}
        sudo apt-get install -y clang-tidy-${{ env.LLVM_VERSION }}
        clang-tidy-${{ env.LLVM_VERSION }} --version
        echo "CLANG_TIDY_EXE=$(command -v clang-tidy-${{ env.LLVM_VERSION }})" >> "$GITHUB_ENV"

    - name: Install clang-tidy (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $installer = Join-Path $env:RUNNER_TEMP 'llvm.exe'
        Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION_WINDOWS }}/LLVM-${{ env.LLVM_VERSION_WINDOWS }}-win64.exe" -OutFile $installer
        Start-Process -FilePath $installer -ArgumentList '/S', '/D=C:\llvm' -Wait
        & 'C:\llvm\bin\clang-tidy.exe' --version
        "CLANG_TIDY_EXE=C:/llvm/bin/clang-tidy.exe" >> $env:GITHUB_ENV

    - name: Setup build environment
      uses: ./.github/actions/setup-vtx
      with:
        conan_user: ${{ secrets.CONAN_SERVER_USER }}
        conan_password: ${{ secrets.CONAN_SERVER_PASSWORD }}

    - name: Install dependencies
      working-directory: ${{env.DEV_DIR}}
      shell: bash
      run: |
        conan export ../lib/ui/qt/conan/wayland
        conan install . -b missing \
          -s build_type=${{ env.BUILD_TYPE }} \
          -s compiler.cppstd=${{ matrix.conan_cppstd }} \
          -o vtx/*:tool_example=True \
          -o vtx/*:tool_mdprep=True \
          -o vtx/*:tool_topology_editor=True \
          -c tools.cmake.cmaketoolchain:generator=Ninja \
          ${{ matrix.conan_extra }}

    # Configure only: generates compile_commands.json, nothing is compiled.
    # PCH disabled so compile commands do not reference a precompiled header that does not exist.
    - name: Configure
      working-directory: ${{env.DEV_DIR}}
      shell: bash
      run: |
        cmake --preset conan-${BUILD_TYPE,,} \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DVTX_ENABLE_PCH=OFF
        test -f "${{ env.BUILD_DIR }}/compile_commands.json"

    - name: Run clang-tidy
      working-directory: ${{github.workspace}}
      shell: bash
      run: |
        PYTHON="$(command -v python || command -v python3)"
        "$PYTHON" .github/scripts/run_clang_tidy.py \
          -p "${{ env.BUILD_DIR }}" \
          --clang-tidy "$CLANG_TIDY_EXE" \
          > clang-tidy.out 2>&1

    - name: Report
      id: report
      if: always()
      working-directory: ${{github.workspace}}
      shell: bash
      run: |
        grep -E ':[0-9]+:[0-9]+: (warning|error): .*\[[a-z][^]]*\]$' clang-tidy.out | tr -d '\r' | sort -u > clang-tidy.diagnostics || true
        COUNT=$(wc -l < clang-tidy.diagnostics)
        echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        {
          echo "## Clang-Tidy (${{ matrix.os }}, ${{ matrix.build_type }})"
          echo ""
          echo "- Diagnostics (deduplicated): $COUNT"
          echo "- Files: $(sed -E 's/:[0-9]+:[0-9]+: .*//' clang-tidy.diagnostics | sort -u | wc -l)"
          echo ""
          echo "### Diagnostics per check"
          echo '```'
          sed -E 's/.*\[([^]]*)\]$/\1/; s/,-warnings-as-errors//' clang-tidy.diagnostics | sort | uniq -c | sort -rn || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: clang-tidy-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          clang-tidy.out
          clang-tidy.diagnostics

    - name: Check diagnostics
      shell: bash
      run: |
        COUNT=${{ steps.report.outputs.count }}
        if [ "$COUNT" -ne 0 ]; then
          echo "::error::clang-tidy reported $COUNT diagnostic(s)"
          exit 1
        fi
