name: App VTX

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
        - Debug
        - Release
      version: 
        description: 'Version'
        required: true
        default: '2026.0.0'
      tool_example:
        description: 'Include tool Example'
        required: false
        default: false
        type: boolean
      tool_mdprep:
        description: 'Include tool Mdprep'
        required: false
        default: false
        type: boolean
      tool_topology_editor:
        description: 'Include tool Topology Editor'
        required: false
        default: false
        type: boolean
      ui_qt:
        description: 'Include Qt UI'
        required: false
        default: true
        type: boolean
      renderer:
        description: 'Include Renderer'
        required: false
        default: true
        type: boolean
      python_binding:
        description: 'Include Python Binding'
        required: false
        default: true
        type: boolean
      cuda_version:
        description: 'CUDA version'
        required: true
        default: '13.2.1'
      cuda_arch:
        description: 'Cuda architectures'
        required: false
      python_version:
        description: 'Python version'
        required: false
        
env:
  ROOT_DIR: ${{github.workspace}}
  BUILD_TYPE: ${{ inputs.build_type }}
  VERSION: ${{ inputs.version }}
  PACKAGE_VERSION: ${{ inputs.version }}-beta
  TOOL_EXAMPLE: ${{ inputs.tool_example == true && 'True' || 'False' }}
  TOOL_MDPREP: ${{ inputs.tool_mdprep == true && 'True' || 'False' }}
  TOOL_TOPOLOGY_EDITOR: ${{ inputs.tool_topology_editor == true && 'True' || 'False' }}
  UI_QT: ${{ inputs.ui_qt == true && 'True' || 'False' }}
  VTX_RENDERER: ${{ inputs.renderer == true && 'True' || 'False' }}
  VTX_PYTHON_BINDING: ${{ inputs.python_binding == true && 'True' || 'False' }}
  CUDA_ARCH: ${{ inputs.cuda_arch }}
  PYTHON_VERSION: ${{ inputs.python_version }}
  RELEASE_DIR: ${{ github.workspace }}/release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2022
            channel: win-x64
            framework: vcredist144-x64
            main_exe: vtx.exe
            conan_cppstd: '20'
          - os: ubuntu-22.04
            channel: linux-x64
            main_exe: vtx
            conan_cppstd: 'gnu20'
          - os: windows-11-arm
            channel: win-arm64
            framework: vcredist144-arm64
            main_exe: vtx.exe
            conan_cppstd: '20'
          - os: ubuntu-22.04-arm
            channel: linux-arm64
            main_exe: vtx
            conan_cppstd: 'gnu20'
          - os: macos-15-intel
            channel: osx-x64
            main_exe: vtx
            conan_cppstd: '20'
          - os: macos-15
            channel: osx-arm64
            main_exe: vtx
            conan_cppstd: '20'
      fail-fast: false

    steps:
    - name: Set git to use CRLF
      if: runner.os == 'Windows'
      run: |
        git config --global core.autocrlf true
        git config --global core.eol crlf
        
    - uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Setup Conan
      uses: conan-io/setup-conan@v1.3.0
      with:
        use_venv: true
        profile_detect: true

    - name: Add custom remote
      run: |
        conan remote add vtx ${{ secrets.CONAN_SERVER_HOST }}
        conan remote login -p ${{ secrets.CONAN_SERVER_PASSWORD }} vtx ${{ secrets.CONAN_SERVER_USER }}
    
#    - name: Install CUDA Toolkit
#      uses: Jimver/cuda-toolkit@v0.2.30
#      id: cuda-toolkit
#      with:
#        cuda: ${{ inputs.cuda_version }}
#        method: network
#        linux-local-args: '["--toolkit"]'

    - name: Create package
      working-directory: ${{env.ROOT_DIR}}
      run: |
        PYTHON_VERSION_OPTION=()
        if [ -n "${PYTHON_VERSION}" ]; then
          PYTHON_VERSION_OPTION=(-o "vtx_python_binding/*:python_version=${PYTHON_VERSION}")
        fi
        CUDA_ARCH_OPTION=()
        if [ -n "${CUDA_ARCH}" ]; then
          CUDA_ARCH_OPTION=(-o "vtx_renderer/*:cuda_arch=${CUDA_ARCH}")
        fi

        conan export lib/app
        conan export lib/core
        conan export lib/io
        conan export lib/python_binding        
        conan export lib/renderer
        conan export lib/ui/qt
        conan export lib/util
        conan export tool/example
        conan export tool/mdprep
        conan export tool/topology_editor
        conan create app/vtx -b missing \
          -s build_type=${{env.BUILD_TYPE}} \
          -s compiler.cppstd=${{ matrix.conan_cppstd }} \
          -o vtx_app/*:version=${{env.VERSION}} \
          -o vtx_app/*:renderer=${{env.VTX_RENDERER}} \
          -o vtx_app/*:python_binding=${{env.VTX_PYTHON_BINDING}} \
          -o vtx/*:renderer=${{env.VTX_RENDERER}} \
          -o vtx/*:python_binding=${{env.VTX_PYTHON_BINDING}} \
          -o vtx/*:tool_example=${{env.TOOL_EXAMPLE}} \
          -o vtx/*:tool_mdprep=${{env.TOOL_MDPREP}} \
          -o vtx/*:tool_topology_editor=${{env.TOOL_TOPOLOGY_EDITOR}} \
          -o vtx/*:ui_qt=${{env.UI_QT}} \
          "${PYTHON_VERSION_OPTION[@]}" \
          "${CUDA_ARCH_OPTION[@]}" \
          -c tools.system.package_manager:mode=install \
          -c tools.system.package_manager:sudo=True \
          --format=json > output.json
      shell: bash

    - name: Read package path from output.json
      id: read_package_path
      working-directory: ${{env.ROOT_DIR}}
      run: echo "PACKAGE_PATH=$(jq -r '.graph.nodes["1"].package_folder' output.json)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Install Velopack CLI
      run: |
        dotnet tool install -g vpk
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      shell: bash

    - name: Download previous release for delta generation
      continue-on-error: true
      run: |
        vpk download github \
          --pre \
          --repoUrl https://github.com/${{ github.repository }} \
          --token ${{ secrets.GITHUB_TOKEN }} \
          --channel ${{ matrix.channel }} \
          --outputDir "${{ env.RELEASE_DIR }}"
      shell: bash

    - name: Remove current version from release dir (Linux)
      if: runner.os != 'Windows'
      run: find "${{ env.RELEASE_DIR }}" -name "*${{ env.VERSION }}*" -delete 2>/dev/null || true

    - name: Remove current version from release dir (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Get-ChildItem "${{ env.RELEASE_DIR }}" -Filter "*${{ env.VERSION }}*" `
          | Remove-Item -Force -ErrorAction SilentlyContinue

    - name: Extract latest changelog
      shell: bash
      run: |
        awk '/^## /{if(found) exit; found=1} found{print}' "${{ env.ROOT_DIR }}/CHANGELOG.md" > "$RUNNER_TEMP/latest_changelog.md"

    - name: Remove Conan metadata from Velopack input
      shell: bash
      run: |
        rm -f "${{ steps.read_package_path.outputs.PACKAGE_PATH }}/conaninfo.txt"
        rm -f "${{ steps.read_package_path.outputs.PACKAGE_PATH }}/conanmanifest.txt"

    - name: Pack installer (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        vpk pack \
          --packId VTX \
          --packVersion "${{ env.PACKAGE_VERSION }}+${{ matrix.channel }}" \
          --packTitle "VTX" \
          --packAuthors "VTX Team" \
          --packDir "${{ steps.read_package_path.outputs.PACKAGE_PATH }}" \
          --mainExe ${{ matrix.main_exe }} \
          --runtime ${{ matrix.channel }} \
          --releaseNotes "$RUNNER_TEMP/latest_changelog.md" \
          --icon "${{ env.ROOT_DIR }}/app/vtx/asset/logo.ico" \
          --splashImage "${{ env.ROOT_DIR }}/app/vtx/asset/splash.png" \
          --framework ${{ matrix.framework }} \
          --channel ${{ matrix.channel }} \
          --outputDir "${{ env.RELEASE_DIR }}"

    - name: Pack installer (Linux)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        vpk pack \
          --packId VTX \
          --packVersion "${{ env.PACKAGE_VERSION }}+${{ matrix.channel }}" \
          --packTitle "VTX" \
          --packAuthors "VTX Team" \
          --packDir "${{ steps.read_package_path.outputs.PACKAGE_PATH }}" \
          --mainExe ${{ matrix.main_exe }} \
          --runtime ${{ matrix.channel }} \
          --releaseNotes "$RUNNER_TEMP/latest_changelog.md" \
          --icon "${{ env.ROOT_DIR }}/app/vtx/asset/logo.ico" \
          --channel ${{ matrix.channel }} \
          --outputDir "${{ env.RELEASE_DIR }}"

    - name: Upload to GitHub release
      run: |
        vpk upload github \
          --pre \
          --merge \
          --repoUrl https://github.com/${{ github.repository }} \
          --releaseName "${{ env.VERSION }} (beta)" \
          --tag v${{ env.VERSION }} \
          --token ${{ secrets.GITHUB_TOKEN }} \
          --channel ${{ matrix.channel }} \
          --outputDir "${{ env.RELEASE_DIR }}"
      shell: bash
