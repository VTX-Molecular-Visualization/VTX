name: App VTX

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
        - Debug
        - Release
      version: 
        description: 'Version'
        required: true
        default: '2026.0.0'
      tool_example:
        description: 'Include tool Example'
        required: false
        default: false
        type: boolean
      tool_mdprep:
        description: 'Include tool Mdprep'
        required: false
        default: true
        type: boolean
      cuda_version:
        description: 'CUDA version'
        required: true
        default: '12.9.0'
      cuda_arch:
        description: 'Cuda architectures'
        required: true
        default: '50;52;60;61;70;75;80;86;89;90'
        
env:
  ROOT_DIR: ${{github.workspace}}
  BUILD_TYPE: ${{ inputs.build_type }}
  VERSION: ${{ inputs.version }}
  TOOL_EXAMPLE: ${{ inputs.tool_example == true && 'True' || 'False' }}
  TOOL_MDPREP: ${{ inputs.tool_mdprep == true && 'True' || 'False' }}
  CUDA_ARCH: ${{ inputs.cuda_arch }}
  RELEASE_DIR: ${{ github.workspace }}/release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2022
            channel: win
            main_exe: vtx.exe
            conan_cppstd: '20'
          - os: ubuntu-22.04
            channel: linux
            main_exe: vtx
            conan_cppstd: 'gnu20'
      fail-fast: false

    steps:
    - name: Set git to use CRLF
      if: runner.os == 'Windows'
      run: |
        git config --global core.autocrlf true
        git config --global core.eol crlf
        
    - uses: actions/checkout@v6.0.2
      with:
        submodules: recursive

    - name: Get Conan
      uses: turtlebrowser/get-conan@v1.2
      
    - name: Create default profile
      run: conan profile detect --force

    - name: Install Linux packaging tools
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y patchelf

    - name: Add custom remote
      run: |
        conan remote add vtx ${{ secrets.CONAN_SERVER_HOST }}
        conan remote login -p ${{ secrets.CONAN_SERVER_PASSWORD }} vtx ${{ secrets.CONAN_SERVER_USER }}

    
#    - name: Install CUDA Toolkit
#      uses: Jimver/cuda-toolkit@v0.2.30
#      id: cuda-toolkit
#      with:
#        cuda: ${{ inputs.cuda_version }}
#        method: network
#        linux-local-args: '["--toolkit"]'

    - name: Create package
      working-directory: ${{env.ROOT_DIR}}
      run: |
        conan export lib/app
        conan export lib/core
        conan export lib/io
        conan export lib/python_binding        
        conan export lib/renderer
        conan export lib/ui/qt
        conan export lib/util
        conan export tool/example
        conan export tool/mdprep
        conan create app/vtx -b missing \
          -s build_type=${{env.BUILD_TYPE}} \
          -s compiler.cppstd=${{ matrix.conan_cppstd }} \
          -o vtx_app/*:version=${{env.VERSION}} \
          -o vtx/*:tool_example=${{env.TOOL_EXAMPLE}} \
          -o vtx/*:tool_mdprep=${{env.TOOL_MDPREP}} \
          -o vtx_renderer/*:cuda_arch="${{env.CUDA_ARCH}}" \
          -c tools.system.package_manager:mode=install \
          -c tools.system.package_manager:sudo=True \
          --format=json > output.json
      shell: bash

    - name: Read package path from output.json
      id: read_package_path
      working-directory: ${{env.ROOT_DIR}}
      run: echo "PACKAGE_PATH=$(jq -r '.graph.nodes["1"].package_folder' output.json)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Install Velopack CLI
      run: |
        dotnet tool install -g vpk
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      shell: bash

    - name: Download previous release for delta generation
      continue-on-error: true
      run: |
        vpk download github \
          --repoUrl https://github.com/${{ github.repository }} \
          --token ${{ secrets.GITHUB_TOKEN }} \
          --channel ${{ matrix.channel }} \
          --outputDir "${{ env.RELEASE_DIR }}"
      shell: bash

    - name: Remove current version from release dir (Linux)
      if: runner.os != 'Windows'
      run: find "${{ env.RELEASE_DIR }}" -name "*${{ env.VERSION }}*" -delete 2>/dev/null || true

    - name: Remove current version from release dir (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Get-ChildItem "${{ env.RELEASE_DIR }}" -Filter "*${{ env.VERSION }}*" `
          | Remove-Item -Force -ErrorAction SilentlyContinue

    - name: Extract latest changelog
      shell: bash
      run: |
        awk '/^## /{if(found) exit; found=1} found{print}' "${{ env.ROOT_DIR }}/app/vtx/CHANGELOG.md" > "$RUNNER_TEMP/latest_changelog.md"

    - name: Pack installer (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        vpk pack \
          --packId VTX \
          --packVersion "${{ env.VERSION }}" \
          --packTitle "VTX" \
          --packAuthors "VTX Team" \
          --packDir "${{ steps.read_package_path.outputs.PACKAGE_PATH }}" \
          --mainExe ${{ matrix.main_exe }} \
          --releaseNotes "$RUNNER_TEMP/latest_changelog.md" \
          --icon "${{ env.ROOT_DIR }}/app/vtx/asset/logo.ico" \
          --splashImage "${{ env.ROOT_DIR }}/app/vtx/asset/splash.png" \
          --framework vcredist144-x64 \
          --channel ${{ matrix.channel }} \
          --outputDir "${{ env.RELEASE_DIR }}"

    - name: Pack installer (Linux)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        vpk pack \
          --packId VTX \
          --packVersion "${{ env.VERSION }}" \
          --packTitle "VTX" \
          --packAuthors "VTX Team" \
          --packDir "${{ steps.read_package_path.outputs.PACKAGE_PATH }}" \
          --mainExe ${{ matrix.main_exe }} \
          --releaseNotes "$RUNNER_TEMP/latest_changelog.md" \
          --icon "${{ env.ROOT_DIR }}/app/vtx/asset/logo.ico" \
          --channel ${{ matrix.channel }} \
          --outputDir "${{ env.RELEASE_DIR }}"

    - name: Upload to GitHub release
      run: |
        vpk upload github \
          --pre \
          --merge \
          --repoUrl https://github.com/${{ github.repository }} \
          --releaseName "${{ env.VERSION }} (beta)" \
          --tag v${{ env.VERSION }} \
          --token ${{ secrets.GITHUB_TOKEN }} \
          --channel ${{ matrix.channel }} \
          --outputDir "${{ env.RELEASE_DIR }}"
      shell: bash
