name: Tool MdPrep
 
on:
  push:
    branches: [ "master", "dev", "dev-sge", "dev-vge" ]
    paths: ['tool/mdprep/**', '.github/workflows/tool_mdprep.yml']
  workflow_dispatch:
      inputs:
        build_type:
          description: 'Build type'
          required: true
          default: 'Release'
          type: choice
          options:
          - Debug
          - Release

env:
  ROOT_DIR: ${{github.workspace}}
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, ubuntu-22.04, windows-latest, ubuntu-latest]
      fail-fast: false

    steps:
    - name: Set git to use CRLF
      run: |
        git config --global core.autocrlf true
        git config --global core.eol crlf
        
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Get Conan
      uses: turtlebrowser/get-conan@v1.2
      
    - name: Create default profile
      run: conan profile detect --force

    - name: Add custom remote
      run: |
        conan remote add vtx ${{ secrets.CONAN_SERVER_HOST }}
        conan remote login -p ${{ secrets.CONAN_SERVER_PASSWORD }} vtx ${{ secrets.CONAN_SERVER_USER }}

    - name: Install libnsl on Ubuntu
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libnsl-dev

    - name: Create package
      working-directory: ${{env.ROOT_DIR}}
      run:  |
        conan export lib/util
        conan export lib/core
        conan export lib/io
        conan export lib/renderer
        conan export lib/app
        conan export lib/python_binding
        conan export lib/ui/qt
        conan create tool/mdprep -b missing -s build_type=${{env.BUILD_TYPE}} -s compiler.cppstd=${{ runner.os == 'Windows' && '20' || 'gnu20' }} -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True -o vtx_tool_mdprep/*:test=True
 
    - name: Upload dependencies
      working-directory: ${{env.ROOT_DIR}}
      run: |
        conan upload gromacs -r=vtx
        conan upload re2 -r=vtx