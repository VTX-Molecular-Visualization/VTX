name: App Bench

on:
  push:
    branches: [ "master", "dev", "dev-sge", "dev-vge" ]
    paths: ['app/bench/**', 'lib/renderer/**', '.github/workflows/app_bench.yml']
  workflow_dispatch:
      inputs:
        build_type:
          description: 'Build type'
          required: true
          default: 'Release'
          type: choice
          options:
          - Debug
          - Release

env:
  ROOT_DIR: ${{github.workspace}}
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2022
            conan_cppstd: '20'
          - os: ubuntu-22.04
            conan_cppstd: 'gnu20'
          - os: windows-latest
            conan_cppstd: '20'
          - os: ubuntu-latest
            conan_cppstd: 'gnu20'
      fail-fast: false

    steps:
    - name: Set git to use CRLF
      if: runner.os == 'Windows'
      run: |
        git config --global core.autocrlf true
        git config --global core.eol crlf
        
    - uses: actions/checkout@v6.0.2
      with:
        submodules: recursive   
        
    - name: Get Conan
      uses: turtlebrowser/get-conan@v1.2
      
    - name: Create default profile
      run: conan profile detect --force

    - name: Add custom remote
      run: |
        conan remote add vtx ${{ secrets.CONAN_SERVER_HOST }}
        conan remote login -p ${{ secrets.CONAN_SERVER_PASSWORD }} vtx ${{ secrets.CONAN_SERVER_USER }}

    - name: Export local packages
      working-directory: ${{env.ROOT_DIR}}
      run: |
        conan export lib/util
        conan export lib/core
        conan export lib/renderer
        conan export lib/io

    - name: Install dependencies
      working-directory: ${{env.ROOT_DIR}}
      run: |
        conan install app/bench -b missing \
          -s build_type=${{env.BUILD_TYPE}} \
          -s compiler.cppstd=${{ matrix.conan_cppstd }} \
          -c tools.system.package_manager:mode=install \
          -c tools.system.package_manager:sudo=True

    - name: Upload dependencies
      run: |
        conan upload sdl -r=vtx
        conan upload imgui -r=vtx

    - name: Create package
      working-directory: ${{env.ROOT_DIR}}
      run: |
        conan create app/bench -b missing \
          -s build_type=${{env.BUILD_TYPE}} \
          -s compiler.cppstd=${{ matrix.conan_cppstd }} \
          -c tools.system.package_manager:mode=install \
          -c tools.system.package_manager:sudo=True \
          --format=json > output.json

    - name: Read package path from output.json
      id: read_package_path
      working-directory: ${{env.ROOT_DIR}}
      run: echo "PACKAGE_PATH=$(jq -r '.graph.nodes["1"].package_folder' output.json)" >> "$GITHUB_OUTPUT"
      shell: bash
        
    - uses: actions/upload-artifact@v7.0.0
      env:
        PACKAGE_PATH: ${{ steps.read_package_path.outputs.PACKAGE_PATH }}
      with:
        name: VTXRendererBench_${{matrix.os}}
        path: ${{env.PACKAGE_PATH}}